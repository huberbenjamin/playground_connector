<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML — Sharp VR Album</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
  <div class="app">

    <!-- Gallery -->
    <section id="gallery" class="screen active">
      <h1>Gallery</h1>
      <div id="gallery-grid" class="grid"></div>
      <button class="fab" onclick="showScreen('camera')">+</button>
    </section>

    <!-- Store -->
    <section id="store" class="screen">
      <button class="back" onclick="showScreen('gallery')">‹</button>
      <h1>Store</h1>
      <div id="store-grid" class="grid"></div>
      <div id="store-panel" class="panel" style="display:none;">
        <div id="selected-store-name">Object selected</div>
        <button onclick="addSelectedToGallery()">Add to Gallery</button>
      </div>
    </section>

    <!-- Camera -->
    <section id="camera" class="screen">
      <h1>Camera</h1>

      <div class="camera-placeholder">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="capture-canvas" style="display:none;"></canvas>
      </div>

      <p id="capture-count">0 / 4 images captured</p>
        <div class="camera-controls">
          <!--<button class="round-button count-button" disabled>
            <span id="capture-number">0</span>
          </button>-->

          <button class="capture-button" onclick="captureImage()"></button>

          <button class="round-button" onclick="continueToProcessing()">
            →
          </button>
        </div>

      <!-- <button onclick="startCamera()">Start Camera</button>
      <button onclick="captureImage()">Capture</button>
      <button onclick="continueToProcessing()">Continue</button>

      <div id="preview-row"></div> -->
    </section>

    <!-- Processing -->
    <section id="processing" class="screen">
      <h1>Processing</h1>
      <div class="camera-placeholder">
        processing...
      </div>
    </section>

    <!-- AR -->
    <section id="ar" class="screen">
      <h1>AR View</h1>
      <div class="ar-placeholder">
        Select an object from Gallery first
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item" onclick="showScreen('ar')">AR</button>
    <button class="nav-item" onclick="showScreen('camera')">CAM</button>
    <button class="nav-item active" onclick="showScreen('gallery')">◼</button>
    <button class="nav-item" onclick="showScreen('store')">⬇</button>
  </nav>

  <script>
    let galleryObjects = [];
    let storeObjects = [];
    let selectedStoreObject = null;

    let capturedImages = [];
    let cameraStream = null;

    async function startCamera() {
      try {
        const video = document.getElementById("camera-video");

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        video.srcObject = cameraStream;
      } catch (error) {
        console.error("Camera access failed:", error);
        alert("Could not access camera. Please allow camera permissions.");
      }
    }

    function captureImage() {
      if (capturedImages.length >= 4) {
        alert("You already captured 4 images.");
        return;
      }

      const video = document.getElementById("camera-video");
      const canvas = document.getElementById("capture-canvas");

      if (!video.srcObject) {
        alert("Start the camera first.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (!blob) return;

        capturedImages.push(blob);
        updateCaptureUI(blob);
      }, "image/jpeg", 0.9);
    }

    function updateCaptureUI(blob) {
      document.getElementById("capture-count").innerText =
        `${capturedImages.length} / 4 images captured`;

      const previewRow = document.getElementById("preview-row");
      const img = document.createElement("img");
      img.className = "preview-img";
      img.src = URL.createObjectURL(blob);
      previewRow.appendChild(img);
    }

    function continueToProcessing() {
      if (capturedImages.length === 0) {
        alert("Capture at least one image first.");
        return;
      }

      stopCamera();
      showProcessing();
    }

    function stopCamera() {
      if (!cameraStream) return;

      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    

    async function loadObjects() {
      const galleryRes = await fetch("/api/gallery-objects");
      galleryObjects = await galleryRes.json();
      const storeRes = await fetch("/api/store-objects");
      storeObjects = await storeRes.json();
      renderGallery();
      renderStore();
    }

    function renderGallery() {
      const grid = document.getElementById("gallery-grid");
      grid.innerHTML = "";
      galleryObjects.forEach(obj => {
        grid.innerHTML += `
          <div class="object-card" onclick="openViewer('${obj.id}')">
            <div class="object-thumb">◼</div>
            <div class="object-name">${obj.name}</div>
            <div class="object-date">${obj.createdAt}</div>
          </div>
        `;
      });
    }

    function renderStore() {
      const grid = document.getElementById("store-grid");
      grid.innerHTML = "";
      storeObjects.forEach(obj => {
        grid.innerHTML += `
          <div class="object-card" onclick="selectStoreObject('${obj.id}')">
            <div class="object-thumb">◼</div>
            <div class="object-name">${obj.name}</div>
            <div class="object-date">${obj.createdAt}</div>
          </div>
        `;
      });

    }

    function selectStoreObject(id) {
      selectedStoreObject = storeObjects.find(o => o.id === id);
      document.getElementById("selected-store-name").innerText = selectedStoreObject.name + " selected";
      document.getElementById("store-panel").style.display = "block";
    }

    function addSelectedToGallery() {

      if (!selectedStoreObject) return;

      const exists = galleryObjects.some(o => o.id === selectedStoreObject.id);

      if (!exists) {
        galleryObjects.push(selectedStoreObject);
      }

      selectedStoreObject = null;
      document.getElementById("store-panel").style.display = "none";
      renderGallery();
      showScreen("gallery");
    }

    function openViewer(id) {
      window.location.href = `/ar/viewer?object=${id}`; //each object opens viewer with own object id
    }

    function showProcessing() {
      showScreen("processing");
      setTimeout(() => {
        alert("Success! Object created.");
        showScreen("gallery");
      }, 1200);
    }
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      document.querySelectorAll(".nav-item").forEach(btn => btn.classList.remove("active"));
      if (id === "camera") {
        startCamera();
      } else {
        stopCamera();
      }
    }
    loadObjects();
  </script>
