<body>
  <main id="demo-page">
    <section id="ar-container" aria-label="AR camera view"></section>

    <section id="ar-control-panel" aria-label="AR controls">
      <a id="back-button" href="{{ url_for('main.ar_index') }}">←</a>
      <button id="start-ar" type="button">Start AR</button>
      <button id="stop-ar" type="button" disabled>Stop AR</button>
      <button id="save-transform" type="button">Save</button>
      <button id="reset-transform" type="button">Reset</button>
      <button id="toggle-log" type="button" aria-pressed="true">▶</button>

      <p id="ar-status" class="is-hidden">Ready. Select up to 6 objects, then tap Start AR.</p>
      <p id="gesture-hint" class="is-hidden">Selected marker: <strong id="active-marker-label">0</strong> · 1 finger rotate · 2 fingers pinch/twist</p>
      <p id="transform-readout" class="is-hidden">Marker 0 · scale 1.50 · rot X -90° Y 0° Z 0°</p>
    </section>

    <button id="drawer-toggle" type="button" aria-controls="object-drawer" aria-expanded="false">⌃ Objects</button>

    <section id="object-drawer" class="collapsed" aria-label="Object picker">
      <div id="drawer-grabber" aria-hidden="true"></div>

      <header id="drawer-header">
        <div>
          <h2>Choose objects</h2>
          <p>Selection order assigns objects to marker 0 → marker 5.</p>
        </div>
        <button id="clear-assignments" type="button">Clear all</button>
      </header>

      <div id="marker-slot-row" aria-label="Assigned marker slots"></div>

      <nav id="object-tabs" aria-label="Object source tabs">
        <button class="tab-button active" type="button" data-tab="demo">Demo</button>
        <button class="tab-button" type="button" data-tab="gallery">Gallery</button>
      </nav>

      <div id="object-collection" aria-label="Objects"></div>
    </section>
  </main>
</body>
