<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Splat Viewer</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
      }
    }
  </script>

  <script>
    window.VIEWER_CONFIG = {
      apiBaseUrl: {{ api_base_url | tojson }},
      splats: [
        {% for i in range(1, 5) %}
          "{{ url_for('static', filename='assets/demo/extracted_%03d.sog' % i) }}"{% if not loop.last %},{% endif %}
        {% endfor %}
      ]
    };
  </script>
</head>
<body>
  <script type="module" src="{{ url_for('static', filename='js/viewer.js') }}"></script>
</body>
</html>
