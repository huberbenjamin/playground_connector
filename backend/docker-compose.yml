services:
  postgres:
    image: postgres:16-alpine
    container_name: playground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: playground
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d playground']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
